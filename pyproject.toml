[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "shannon-entropy"
# Static version (keep in sync with python/shannon/__init__.py and CMake project VERSION).
# Do NOT use dynamic version via package import — that pulls numpy and produces
# UNKNOWN-0.0.0 wheels on clean / older pip builds.
version = "2.1.0"
description = "Shannon Entropy Collapse Detection — physics-grounded LLM safety primitive"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Louis-Philippe Morency", email = "lp@thebonhomme.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
keywords = ["entropy", "llm", "safety", "deception-detection", "ai-safety"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
numba = ["numba>=0.59"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
all = ["numba>=0.59", "openai>=1.0", "anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.0",
    "twine>=5.0",
    # Optional at runtime, REQUIRED for a trustworthy test run.
    #
    # hub/system_monitor.py degrades to subprocess parsing when psutil is
    # absent, so both code paths are real and both must be exercised. The
    # mock-driven tests in hub/tests/test_system_monitor.py run either way,
    # but TestRealPsutil (which pins the psutil path against the actual
    # library) is skipped without it. Declaring it here means CI never takes
    # that skip — a permanently-skipped test is indistinguishable from a
    # deleted one.
    "psutil>=5.9",
    # hub/tests exercise the gate's socket and HTTP transports.
    "aiohttp>=3.9",
    "requests>=2.31",
]

[project.scripts]
shannon-monitor = "shannon.cli:main"

[project.urls]
Homepage = "https://github.com/LeBonhommePharma/Shannon"
Repository = "https://github.com/LeBonhommePharma/Shannon"
Issues = "https://github.com/LeBonhommePharma/Shannon/issues"
Changelog = "https://github.com/LeBonhommePharma/Shannon/blob/main/CHANGELOG.md"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]
include = ["shannon*", "shannon_contact*"]
namespaces = false

# cibuildwheel: produce installable wheels even when the optional C++ extension
# cannot be compiled (pure-Python fallback). setup.py never fails the install.
[tool.cibuildwheel]
build-frontend = "build"
skip = "pp* *-win32 *-manylinux_i686 *-musllinux_i686"
test-command = "python -c \"import shannon; print(shannon.__version__)\""
test-skip = ""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0" }

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests"]
python_files = ["test_*.py"]
# Installer / pure-Python CI paths must stay warning-clean. Intentional
# deprecation coverage for legacy on_collapse= is filtered here; new
# DeprecationWarnings elsewhere still surface.
filterwarnings = [
    "ignore:ShannonCollapseDetector\\(on_collapse=.*:DeprecationWarning",
    "ignore:no previously-included files matching.*:UserWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
# Must stay >= 3.12 even though the package supports >= 3.10 (see
# requires-python). This setting controls the syntax mypy uses to parse
# *dependency stubs*, not just our own code, and numpy >= 2.5 ships
# numpy/__init__.pyi with PEP 695 `type` statements. Under python_version
# "3.10" mypy raised
#     numpy/__init__.pyi: error: Type statement is only supported in Python
#     3.12 and greater  [syntax]
# and then bailed with "errors prevented further checking", so it silently
# checked only 9 of 16 files. Runtime 3.10 compatibility is covered by the CI
# test matrix, not by this setting.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

# Optional extras and the compiled C++ modules ship no stubs. Every one of these
# is imported behind a try/except ImportError with a documented fallback, so an
# unresolved import here is the expected state, not a defect worth reporting.
[[tool.mypy.overrides]]
module = [
    "shannon._core",
    "_shannon_contact_cpp.*",
    "numba.*",
    "openai.*",
    "sklearn.*",
    "scipy.*",
]
ignore_missing_imports = true
